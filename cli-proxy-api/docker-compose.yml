services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    pull_policy: always
    container_name: cli-proxy-api
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CONFIG_PATH}:/CLIProxyAPI/config.yaml
      - ${AUTHS_DIR_PATH}:/root/.cli-proxy-api
      - ${LOGS_DIR_PATH}:/CLIProxyAPI/logs
    restart: unless-stopped
